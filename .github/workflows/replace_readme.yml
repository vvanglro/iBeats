name: Replace README AND GENERATE SVG

on:
  workflow_dispatch:
    inputs:
      time:
        description: 'time list'
        required: false
      value:
        description: 'value list'
        required: false

env:
  GITHUB_NAME: vvanglro
  GITHUB_EMAIL: vvanglro@gmail.com

jobs:
  sync:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          python -c "import svgwrite; print('svgwrite ok')"

      - name: Replace README AND generate SVG
        env:
          INPUT_TIME: ${{ github.event.inputs.time }}
          INPUT_VALUE: ${{ github.event.inputs.value }}
        run: |
          if [ -z "${INPUT_TIME}" ] || [ -z "${INPUT_VALUE}" ]; then
            echo "No heart rate data provided, skip generation."
            exit 0
          fi
          python main.py "$INPUT_TIME" "$INPUT_VALUE"

      - name: Push README
        run: |
          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add .
          git commit -m 'update new heart' || echo "nothing to commit"
          git push || echo "nothing to push"
